AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Dinner Ideas Frontend Stack
  Resources: App S3 bucket, CloudFront distribution with dual origins
  (S3 for static assets, API Gateway for /api/* requests), OAC for S3.

Parameters:
  ApiGatewayDomain:
    Type: String
    Description: >
      API Gateway domain name (without protocol or stage).
      Example: abc123.execute-api.us-west-1.amazonaws.com

  ApiGatewayStage:
    Type: String
    Default: prod
    Description: API Gateway stage name used as CloudFront origin path.

Resources:
  # =========================================================================
  # App S3 Bucket — hosts the built React frontend
  # =========================================================================
  AppBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'dinner-ideas-app-${AWS::AccountId}-${AWS::Region}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      Tags:
        - Key: Application
          Value: dinner-ideas

  # Bucket policy — grants read access ONLY to the CloudFront distribution
  AppBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref AppBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${AppBucket.Arn}/*'
            Condition:
              StringEquals:
                'AWS:SourceArn': !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistribution}'

  # =========================================================================
  # CloudFront Origin Access Control — secure S3 access
  # =========================================================================
  S3OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: dinner-ideas-s3-oac
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # =========================================================================
  # CloudFront Function — strips /api prefix before forwarding to API Gateway
  # This allows the frontend to use relative /api/* URLs while the Lambda
  # receives the original path structure it expects.
  # =========================================================================
  ApiPathRewriteFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: dinner-ideas-api-path-rewrite
      AutoPublish: true
      FunctionConfig:
        Comment: Strips /api prefix from URI before forwarding to API Gateway origin
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
            var request = event.request;
            if (request.uri.startsWith('/api/')) {
                request.uri = request.uri.substring(4);  // remove '/api'
            } else if (request.uri === '/api') {
                request.uri = '/';
            }
            return request;
        }

  # =========================================================================
  # CloudFront Distribution
  # =========================================================================
  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: Dinner Ideas — SPA frontend + API proxy
        Enabled: true
        HttpVersion: http2and3
        PriceClass: PriceClass_100   # US, Canada, Europe only (cheaper)
        DefaultRootObject: index.html

        # ---- Origins ----

        Origins:
          # Origin 1: S3 bucket for static assets
          - Id: S3Origin
            DomainName: !GetAtt AppBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt S3OriginAccessControl.Id
            S3OriginConfig: {}

          # Origin 2: API Gateway for backend requests
          - Id: ApiGatewayOrigin
            DomainName: !Ref ApiGatewayDomain
            OriginPath: !Sub '/${ApiGatewayStage}'
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols:
                - TLSv1.2
            OriginCustomHeaders:
              - HeaderName: X-Forwarded-Origin
                HeaderValue: CloudFront

        # ---- Cache Behaviors ----

        # API behavior: /api/* → API Gateway (no caching, path rewrite)
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
          CachedMethods:
            - GET
            - HEAD
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6   # CachingOptimized
          OriginRequestPolicyId: 88a5eaf4-2fd4-4709-b370-b4c650ea3fcf  # CORS-S3Origin
          FunctionAssociations: []

        # Ordered behaviors evaluated BEFORE default
        OrderedCacheBehaviors:
          - PathPattern: /api/*
            TargetOriginId: ApiGatewayOrigin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods:
              - GET
              - HEAD
              - POST
              - PUT
              - DELETE
              - OPTIONS
              - PATCH
            CachedMethods:
              - GET
              - HEAD
            Compress: true
            # Managed policy: CachingDisabled (no cache for API)
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            # Managed policy: AllViewer (forward all headers/query/cookies)
            OriginRequestPolicyId: 216adef6-5c7f-47e4-b989-5492eafa07d3
            FunctionAssociations:
              - EventType: viewer-request
                FunctionARN: !GetAtt ApiPathRewriteFunction.FunctionARN

        # ---- Custom Error Responses (SPA routing) ----
        # Return index.html with 200 for 403 (S3 returns 403 for missing objects
        # when not using website hosting) and actual 404s
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html

        # ---- Misc ----
        ViewerCertificate:
          CloudFrontDefaultCertificate: true

      Tags:
        - Key: Application
          Value: dinner-ideas

# ===========================================================================
# Outputs
# ===========================================================================
Outputs:
  CloudFrontDistributionId:
    Description: CloudFront distribution ID (needed for invalidation commands)
    Value: !Ref CloudFrontDistribution

  CloudFrontDomainName:
    Description: CloudFront distribution domain name (e.g., xyz.cloudfront.net)
    Value: !GetAtt CloudFrontDistribution.DomainName

  AppBucketName:
    Description: S3 bucket name for the built frontend files
    Value: !Ref AppBucket

  AppBucketRegionalDomainName:
    Description: S3 bucket regional domain name (for s3 sync)
    Value: !GetAtt AppBucket.RegionalDomainName
