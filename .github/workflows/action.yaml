name: Deploy

on:
  push:
    branches: [ main ]

# Prevent concurrent deployments — if a new push happens while a deploy
# is in progress, cancel the in-progress one and start fresh.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================================================
  # Backend: Build .NET Lambda + deploy CloudFormation stack
  # (Lambda, API Gateway, DynamoDB, Image S3 bucket, IAM role)
  # ==========================================================================
  back-end-deploy:
    name: Deploy Backend
    runs-on: ubuntu-latest
    outputs:
      api-gateway-url: ${{ steps.backend-outputs.outputs.api_gateway_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Setup .NET 10
        uses: actions/setup-dotnet@3e891b0cb619bf60e2c25674b222b8940e2c1c25  # v4.1.0
        with:
          dotnet-version: '10.x'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502  # v4.0.2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-west-1

      - name: Deploy backend
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          STAGE: prod
        run: |
          cd ./dinner-ideas-api
          ./deploy-backend.sh

      - name: Capture outputs
        id: backend-outputs
        run: |
          API_URL=$(aws cloudformation describe-stacks \
            --stack-name dinner-ideas-backend \
            --region us-west-1 \
            --query 'Stacks[0].Outputs[?OutputKey==`ApiGatewayUrl`].OutputValue' \
            --output text)
          echo "api_gateway_url=$API_URL" >> $GITHUB_OUTPUT
          echo "API Gateway URL: $API_URL"

  # ==========================================================================
  # Frontend: Build React/Vite app + deploy CloudFormation stack
  # (S3 bucket + CloudFront distribution with OAC)
  # Requires backend stack to be deployed first (needs API Gateway URL).
  # ==========================================================================
  front-end-deploy:
    name: Deploy Frontend
    runs-on: ubuntu-latest
    needs: back-end-deploy
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a  # v4.2.0
        with:
          node-version: '24.18.0'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502  # v4.0.2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-west-1

      - name: Deploy frontend
        env:
          STAGE: prod
        run: |
          cd ./dinner-ideas-api
          ./deploy-frontend.sh


